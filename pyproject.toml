[project]
name = "semantic-boxels"
version = "0.1.0"
description = "Semantic Boxels: adaptive space abstraction for partially observable TAMP"
readme = "README.md"
license = "MIT"
# TAMPURA targets Python 3.11, and numpy 1.x has no wheels for newer versions.
requires-python = "==3.11.*"
dependencies = [
    # tampura_environments@4167c35 pins numpy==1.24.4 in its own pyproject.toml;
    # it is used as a checkout, not installed, so uv cannot see that pin.
    "numpy>=1.24,<2",
    "pybullet",
    "matplotlib",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
]
# TAMPURA, for the find_dice bridge and for running TAMPURA itself (arm T).
# Installing tampura builds its SymK planner (needs cmake, make, a C++ compiler,
# autoconf, automake and libtool), and brings tampura's own dependencies.
# tampura_environments stays a checkout made by scripts/setup.sh (it does not
# import as shipped, and its scene loader reads files from the checkout), so
# its one extra dependency, imageio, is listed here.  torch is listed only so
# that the CPU-only index below applies to it.
tampura = [
    "tampura @ git+https://github.com/aidan-curtis/tampura.git@cdddf14b45d2608fc1d3bc9c72d8ee249c4638b2",
    "imageio",
    "torch",
]

[tool.uv]
# Not an installable package: uv only manages the environment.
package = false
default-groups = ["dev"]

# Build settings for tampura's SymK planner (old C++ on new toolchains):
# - cmake >= 4 refuses cmake_minimum_required(VERSION < 3.5), which SymK declares;
# - GCC >= 14 turns -Wtemplate-body into an error in SymK's bundled tl::optional
#   (older GCC and clang ignore the flag);
# - CUDD builds HTML docs when doxygen is installed, and recent doxygen crashes on them.
[tool.uv.extra-build-variables]
tampura = { CMAKE_POLICY_VERSION_MINIMUM = "3.5", CXXFLAGS = "-Wno-template-body", DOXYGEN = "true" }

# CPU-only torch: TAMPURA imports torch, but find_dice never uses a GPU, and the
# CUDA wheels add several GB.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests", "tampura_bridge/tests"]
