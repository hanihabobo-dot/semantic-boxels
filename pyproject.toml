[project]
name = "semantic-boxels"
version = "0.1.0"
description = "Semantic Boxels: adaptive space abstraction for partially observable TAMP"
readme = "README.md"
license = "MIT"
# TAMPURA targets Python 3.11, and numpy 1.x has no wheels for newer versions.
requires-python = "==3.11.*"
dependencies = [
    # tampura_environments@4167c35 pins numpy==1.24.4 in its own pyproject.toml;
    # it is used as a checkout, not installed, so uv cannot see that pin.
    "numpy>=1.24,<2",
    "pybullet",
    "matplotlib",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
]
# TAMPURA's runtime dependencies, as declared in the pyproject.toml files of
# tampura@cdddf14 and tampura_environments@4167c35.  They are needed for the
# find_dice bridge and for running TAMPURA itself.  TAMPURA's own code is a
# checkout that scripts/setup.sh builds, not an installed package.
tampura = [
    "black",
    "docformatter",
    "gymnasium",
    "imageio",
    "isort",
    "networkx",
    "open3d",
    "pexpect",
    "pylint",
    "pymdptoolbox",
    "pytest-pylint",
    "pyyaml",
    "pyzmq",
    "rtree",
    "scipy",
    "six",
    "stable-baselines3",
    "tabulate",
    "tensorboard",
    "torch",
    "trimesh",
    "zmq",
]

[tool.uv]
# Not an installable package: uv only manages the environment.
package = false
default-groups = ["dev"]

# CPU-only torch: TAMPURA imports torch, but find_dice never uses a GPU, and the
# CUDA wheels add several GB.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests", "tampura_bridge/tests"]
