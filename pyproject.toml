[project]
name = "semantic-boxels"
version = "0.1.0"
description = "Semantic Boxels: adaptive space abstraction for partially observable TAMP"
readme = "README.md"
license = "MIT"
# The paper's runs (arm O, BF#6/BF#15) used CPython 3.11.15.
requires-python = "==3.11.*"
# Pinned to the versions of the environment that produced the find_dice
# results (archive/.../BF7_b1j/armO_venvA_pip_freeze.txt).
dependencies = [
    "numpy==1.24.4",
    "pybullet==3.2.7",
    "matplotlib==3.10.9",
    "pillow==12.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]
# Runtime dependencies of TAMPURA (tampura@cdddf14 and tampura_environments@4167c35),
# needed for the find_dice bridge and for running TAMPURA itself. TAMPURA's own
# code is a checkout built by scripts/setup.sh, not an installed package.
tampura = [
    "black==26.5.1",
    "docformatter==1.7.8",
    "gymnasium==1.2.3",
    "isort==8.0.1",
    "networkx==3.6.1",
    "open3d==0.19.0",
    "pexpect==4.9.0",
    "pylint==4.0.5",
    "pymdptoolbox==4.0b3",
    "pytest-pylint==0.21.0",
    "pyyaml==6.0.3",
    "pyzmq==27.1.0",
    "rtree==1.4.1",
    "scipy==1.15.3",
    "six==1.17.0",
    "stable-baselines3==2.8.0",
    "tabulate==0.10.0",
    "tensorboard==2.20.0",
    "torch==2.12.0",
    "trimesh==4.12.2",
    "zmq==0.0.0",
]

[tool.uv]
# Not an installable package: uv only manages the environment.
package = false
default-groups = ["dev"]

# Every other package at the version of the paper's environment (its pip freeze),
# so the lock reproduces it rather than whatever is newest when it is resolved.
