# CPU-only torch: TAMPURA imports torch but find_dice never uses a GPU, and the
# CUDA wheels add several GB.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests", "tampura_bridge/tests"]
